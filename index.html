<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVPKalasin Feedback</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap');

        :root {
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --line: #e2e8f0;
            --accent: #4f46e5;
            --accent-dark: #4338ca;
        }

        html { background: var(--bg); }

        /* body ทำหน้าที่เป็นการ์ด เพื่อไม่ต้องเพิ่ม HTML ใหม่ */
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            max-width: 560px;
            margin: 48px auto;
            padding: 36px 32px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 32px rgba(15, 23, 42, 0.06);
            line-height: 1.6;
            color: var(--text);
            box-sizing: border-box;
        }

        h2 { margin: 0 0 28px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }

        .form-group { margin-bottom: 22px; }
        label { font-weight: 500; font-size: 15px; display: block; margin-bottom: 8px; }
        .sub-label { font-size: 12.5px; color: var(--muted); font-weight: 400; }

        input[type="text"], input[type="tel"], textarea {
            width: 100%; padding: 12px 14px; box-sizing: border-box; font-size: 15px;
            font-family: inherit; color: var(--text); background: #fff;
            border: 1px solid var(--line); border-radius: 10px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder, textarea::placeholder { color: #94a3b8; }
        input[type="text"]:focus, input[type="tel"]:focus, textarea:focus {
            border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }
        textarea { height: 130px; resize: vertical; }

        button {
            padding: 13px 20px; background-color: var(--accent); color: white; border: none;
            border-radius: 10px; cursor: pointer; font-size: 16px; font-family: inherit;
            width: 100%; font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background-color: var(--accent-dark); }
        button:active { transform: scale(0.99); }
        button:disabled { background-color: #a5b4fc; cursor: not-allowed; transform: none; }
        button:focus-visible { outline: 3px solid rgba(79, 70, 229, 0.35); outline-offset: 2px; }

        #result { margin-top: 22px; padding: 16px 20px; border-radius: 10px; display: none; text-align: center; }
        .result-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }

        @media (max-width: 600px) {
            body { margin: 0; border-radius: 0; box-shadow: none; min-height: 100vh; padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <h2>ส่ง Feedback ถึงเรา</h2>

    <div class="form-group">
        <label for="userName">ชื่อของคุณ <span class="sub-label">(ไม่บังคับ)</span></label>
        <input type="text" id="userName" placeholder="เช่น คุณสมชาย">
    </div>

    <div class="form-group">
        <label for="userPhone">
            เบอร์โทรศัพท์ 
            <span class="sub-label">(ระบุเพื่อให้ทีมงานติดต่อกลับเพื่อช่วยเหลือ หรือติดตามผล)</span>
        </label>
        <input type="tel" id="userPhone" maxlength="10" placeholder="เช่น 0612345678 (เผื่อกรณีต้องการให้เจ้าหน้าที่ติดต่อกลับ)">
    </div>

    <div class="form-group">
        <label for="inputText">ข้อความ Feedback <span style="color:#dc2626">*</span></label>
        <textarea id="inputText" maxlength="300" placeholder="แจ้งปัญหา ข้อเสนอแนะ หรือความประทับใจของคุณได้ที่นี่...(ไม่เกิน 300 ตัวอักษร) "></textarea>
    </div>

    <button id="submitBtn" onclick="sendFeedback()">ส่งข้อความ</button>

    <div id="result"></div>

    <script>
        // โหลดข้อมูลเดิมที่เคยกรอกไว้ให้อัตโนมัติ
        window.onload = function() {
            document.getElementById('userName').value = localStorage.getItem('feedback_user_name') || '';
            document.getElementById('userPhone').value = localStorage.getItem('feedback_user_phone') || '';
        };

        async function sendFeedback() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const text = document.getElementById('inputText').value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('submitBtn');
            
            if (!text) return alert('กรุณากรอกข้อความ Feedback ก่อนส่งครับ');
            
            // บันทึกข้อมูลเข้า LocalStorage
            if (name) localStorage.setItem('feedback_user_name', name);
            if (phone) localStorage.setItem('feedback_user_phone', phone);

            // ปรับ UI ขณะกำลังส่งข้อความ (Loading State)
            btn.disabled = true;
            btn.innerText = 'กำลังส่งข้อมูล...';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, name, phone })
                });
                
                const data = await response.json();
                
                // กรณีเกิดข้อผิดพลาดจาก Backend หรือส่ง LINE ไม่สำเร็จ
                if (data.error || data.line_sent === false) {
                    resultDiv.style.display = 'block';
                    resultDiv.style.backgroundColor = '#fef2f2';
                    resultDiv.style.borderColor = '#fecaca';
                    resultDiv.style.border = '1px solid #fecaca';
                    
                    const errorText = data.error || 'เกิดข้อผิดพลาดในการส่งข้อมูลไปยังระบบ กรุณาลองใหม่อีกครั้ง';
                    
                    resultDiv.innerHTML = `
                        <div class="result-title" style="color: #991b1b;">เกิดข้อผิดพลาด!</div>
                        <p style="margin: 0; color: #991b1b;">
                            ${errorText}
                        </p>
                    `;
                    return;
                }

                // กรณีส่งสำเร็จเรียบร้อย (กล่องสีเขียว)
                resultDiv.style.display = 'block';
                resultDiv.style.backgroundColor = '#f0fdf4';
                resultDiv.style.borderColor = '#bbf7d0';
                resultDiv.style.border = '1px solid #bbf7d0';
                
                let contactMsg = phone 
                    ? `หากมีข้อสงสัยเพิ่มเติม เจ้าหน้าที่อาจติดต่อกลับไปยังเบอร์ <strong>${phone}</strong> ครับ`
                    : 'ขอบคุณสำหรับทุกข้อเสนอแนะเพื่อนำไปปรับปรุงการบริการครับ';

                resultDiv.innerHTML = `
                    <div class="result-title" style="color: #166534;">ส่งข้อมูลเรียบร้อยแล้ว!</div>
                    <p style="margin: 0; color: #166534;">
                        ขอบคุณสำหรับ Feedback ของคุณ${name ? ' ' + name : ''} <br>
                        <small style="color: #15803d;">${contactMsg}</small>
                    </p>
                `;

                // ล้างช่องข้อความหลังส่งสำเร็จ
                document.getElementById('inputText').value = '';

            } catch (err) {
                // กรณี Network Error / Catch Error (กล่องสีแดง)
                resultDiv.style.display = 'block';
                resultDiv.style.backgroundColor = '#fef2f2';
                resultDiv.style.borderColor = '#fecaca';
                resultDiv.style.border = '1px solid #fecaca';
                
                resultDiv.innerHTML = `
                    <div class="result-title" style="color: #991b1b;">เกิดข้อผิดพลาด!</div>
                    <p style="margin: 0; color: #991b1b;">
                        ไม่สามารถเชื่อมต่อระบบได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง
                    </p>
                `;
            } finally {
                // คืนค่าปุ่มส่งข้อความ
                btn.disabled = false;
                btn.innerText = 'ส่งข้อความ';
            }
        }
    </script>
</body>
</html>
